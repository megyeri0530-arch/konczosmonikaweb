<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lélek-gondolatok Admin | Konczosné Megyeri Mónika</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Enable manual CMS init to prevent double collection error -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <!-- Decap CMS Application -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'git-gateway',
          branch: 'main'
        },
        media_folder: 'picture',
        public_folder: 'picture',
        collections: [
          {
            name: 'blog',
            label: 'Lélek-gondolatok',
            files: [
              {
                label: 'Összes Lélek-gondolat Bejegyzés',
                name: 'posts_list',
                file: 'posts.json',
                fields: [
                  {
                    label: 'Bejegyzések',
                    name: 'posts',
                    widget: 'list',
                    summary: '{{fields.title}} - {{fields.date}}',
                    fields: [
                      { label: 'Azonosító (ID)', name: 'id', widget: 'string' },
                      { label: 'Cím', name: 'title', widget: 'string' },
                      { label: 'Dátum', name: 'date', widget: 'string' },
                      { label: 'Szerző', name: 'author', widget: 'string', default: 'Konczosné Megyeri Mónika' },
                      { label: 'Kategória', name: 'category', widget: 'select', options: ['Lélek-gondolatok', 'Angyali Útmutatás', 'Expanse Therapy®', 'Önismeret'] },
                      { label: 'Kép útvonal', name: 'image', widget: 'string', default: 'picture/ethereal_angel_hero_bg.png' },
                      { label: 'Rövid összefoglaló', name: 'excerpt', widget: 'text' },
                      { label: 'Bejegyzés tartalma', name: 'body', widget: 'markdown' }
                    ]
                  }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
